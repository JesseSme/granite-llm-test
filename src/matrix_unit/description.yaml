name: matrix_unit
description: >
  Implements torch.nn.Linear — the linear projection y = xW^T + b used by every
  Linear layer in the Granite 4.0-H-350M model (F.linear / `aten::linear`).
  This is the most heavily used unit, invoked for all matrix multiplications
  across the network. Parameterized (IN_FEATURES x OUT_FEATURES) bfloat16
  weight matrix; all data bf16.

  Weight dimensions seen in the inference trace:
  - (3376, 768) — Mamba2 in_proj: 768->3376
  - (768, 1536) — Mamba2 out_proj: 1536->768
  - (4096, 768) — MLP gate+up projection: 768->4096
  - (768, 2048) — MLP down projection: 2048->768
  - (768, 768) — Attention Q and O projections: 768->768
  - (256, 768) — Attention K and V projections: 768->256

  Numerics: bf16 x and W are widened to binary32 exactly; the dot product is
  accumulated sequentially in binary32 (bf16 x bf16 products are exact in
  binary32), the bias is added last in binary32, and the final sum is rounded
  once to bfloat16. This matches torch's bf16 F.linear; rare (<<0.1%) 1-ULP
  differences can remain because ATen's blocked GEMM accumulation order is not
  replicated.

  Parameter LANES (default 1): each lane owns a complete binary32 MAC datapath
  (its own fp_unit MUL, fp_unit ADD and accumulator) and computes a different
  output row. The lanes are independent rows and never exchange data, so every
  row keeps the exact sequential fp32 accumulation order and the result is
  bit-identical to LANES=1. Weight rows are packed LANES per memory word so one
  read serves all lanes; rows are emitted in row order and the final block is
  masked when OUT_FEATURES % LANES != 0. LANES=1 reproduces the original
  behavior/configs.

interface:
  description: >
    Weight/bias load port (one element per cycle) plus AXI-Stream input/output
    for the activation vectors.
  ports:
    - name: clk
      direction: input
      width: 1
      description: Clock signal
    - name: rst_n
      direction: input
      width: 1
      description: Active-low synchronous reset
    - name: load_en
      direction: input
      width: 1
      description: Weight/bias write enable
    - name: load_out_idx
      direction: input
      width: clog2(OUT_FEATURES)
      description: Output row index for weight/bias load
    - name: load_in_idx
      direction: input
      width: clog2(IN_FEATURES)
      description: Input column index for weight load
    - name: load_wdata
      direction: input
      width: 16
      description: bfloat16 weight or bias value
    - name: load_is_bias
      direction: input
      width: 1
      description: 0 = weight, 1 = bias
    - name: s_axis_tvalid
      direction: input
      width: 1
      description: AXI-Stream input valid (x vector, IN_FEATURES beats)
    - name: s_axis_tready
      direction: output
      width: 1
      description: AXI-Stream input ready (high only while idle)
    - name: s_axis_tdata
      direction: input
      width: 16
      description: bfloat16 input element
    - name: s_axis_tlast
      direction: input
      width: 1
      description: Input last beat (expected on the final x element)
    - name: m_axis_tvalid
      direction: output
      width: 1
      description: AXI-Stream output valid (y vector, OUT_FEATURES beats)
    - name: m_axis_tready
      direction: input
      width: 1
      description: AXI-Stream output ready (downstream backpressure)
    - name: m_axis_tdata
      direction: output
      width: 16
      description: bfloat16 output element
    - name: m_axis_tlast
      direction: output
      width: 1
      description: Output last beat (final y element)
    - name: busy
      direction: output
      width: 1
      description: Unit is computing/streaming (input not accepted)

max_clock_speed: >
  ~300 MHz (ltp-proxy estimate; the flattened critical path dropped from 221
  (master) / 211 (post-P4) to 137 logic levels with the 2-stage fp_add_pipe2
  accumulator, ~1.54x the previous proxy bound of 200 MHz; no STA cell library
  available)

characteristics:
  latency: >
    Per ROWSPW = 2*LANES-row pass: 1 MAC_FILL cycle + (2*IN_FEATURES + 6) MAC
    slots (two 0+0 context seeds, one accumulate slot per element per context,
    two bias slots, two result-latch slots) + 1 STORE cycle + 2*LANES output
    beats, i.e. the same IN_FEATURES + 4 + LANES cycles per LANES output rows
    as the single-context schedule (IN_FEATURES + 5 per row at LANES=1), plus
    handshake stalls. For 768->768 at LANES=4: ~4x fewer cycles per vector
    (~148k vs ~593k at LANES=1).
  throughput: LANES multiply-accumulates per cycle (one per lane; two interleaved
    accumulator contexts alternate through each lane's 2-stage fp_add_pipe2, so
    there are no stalls between MACs)
  resource_usage: >
    Parameterized (W_WORDS x IN_FEATURES) x (2*LANES x 16)-bit weight RAM,
    N_ROWS x 16-bit bias RAM (rows padded to a ROWSPW multiple),
    IN_FEATURES x 16-bit input buffer, LANES x (one binary32 fp_unit MUL + one
    binary32 fp_add_pipe2 2-stage adder + two fp32_to_bf16_round units + two
    32-bit context result registers), plus a registered x operand (mul_a_q)
    shared by the lanes and LANES registered weight operands (mul_b_q[l])
    between the weight memory and the multipliers.
  notes: >
    AXI-Stream contract: the input vector is IN_FEATURES beats with tlast on the
    final beat (the counter bound also ends streams that omit tlast); the output
    vector is OUT_FEATURES beats with tlast on the final beat and is held stable
    under downstream backpressure. Weights must be loaded before streaming.
    Each lane carries two accumulator contexts through the shared 2-cycle adder
    (context A on even MAC slots, context B on odd slots); the adder output
    register is each context's accumulator because it is only overwritten by
    that context's next submission. The multiplier operands are registered and
    prefetched two slots ahead (the MUL has an operand register + output
    register), the products alternate A/B per input element, and the per-row add
    sequence is exactly the single-context one (0+0 seed, products in order,
    bias last), so every output row is bit-identical to the LANES=1, one-context
    schedule. final_a/final_b latch the two biased sums per lane and the STORE
    stage places them in row order in out_buf (registered tvalid, data stable
    under backpressure). The final pass masks to OUT_FEATURES % ROWSPW valid
    rows.
  unit_verification: >
    tb_matrix_unit.py, 8 vectors, random input bubbles, randomized output stalls
    and tlast checked on every beat, vs the sequential-fp32 golden sample:
    - IN=32 OUT=16 LANES=1: 128/128 bit-exact (4755 busy cycles, 8 vectors)
    - IN=32 OUT=16 LANES=4: 128/128 bit-exact (1299 busy cycles; ~3.7x fewer)
    - IN=32 OUT=6 LANES=4 (masked tail): 48/48 bit-exact (643 busy cycles)
    Busy cycles are identical to the pre-P2 single-context schedule (the cycle
    model is unchanged); the pipelined adder was additionally checked against
    fp_add by a standalone Verilator C++ harness over 20,000,000 biased-random
    vectors and zeros (0 mismatches in y): fp_add_pipe2 is bit-identical.
    Run: `.venv/bin/python run_test.py`, `... run_test.py lanes4`, `... tail`.
  in_loop_verification: >
    tb_matrix_unit_inloop.py: real Granite Linear layers. q_proj (768x768) of
    layer 10: 6144/6144 outputs bit-exact (100%, max abs error 0.0); k_proj
    (768x256) of layer 10: 2048/2048 bit-exact (100%, max abs error 0.0).
    Run: `.venv/bin/python run_test.py inloop`.
  formal_verification: >
    formal/bmc.sby (SymBiYosys BMC, depth 40, fp_units and fp_add_pipe2
    abstracted via anyseq stubs fp_unit_stub.sv / fp_add_pipe2_stub.sv) proves:
    s_axis_tready == !busy, output valid only while busy, tlast only on the
    final output beat, busy rises only after an accepted input beat, and exactly
    OUT_FEATURES output beats per input vector. Run: sby -f bmc.sby.
    formal/bmc_lanes.sby re-runs the same properties with LANES=4 and
    OUT_FEATURES=2 < ROWSPW=8 (masked-tail corner); depth 40 PASS.

optimization:
  branch: opt/matrix-unit
  goal: raise clock frequency (accumulator loop is the critical path), then
    throughput (L parallel output lanes), keeping every output bit-identical.
  plan: >
    P3 register the multiplier operands and m_axis_tdata (RAM off the
    arithmetic path, enables SRAM inference); P1 add LANES (L full MAC
    datapaths for L different output rows, bit-exact because each row keeps
    the exact sequential fp32 add order); P2 pipeline fp_add in the fp library
    plus P interleaved accumulator contexts; P4 balanced leading-one detectors.
  out_of_scope: any reassociation, fp_fma fusion, wide exact accumulator, or
    removing the 0+p0 seed (all change results).
  status: >
    P3, P1 and P2 (2-stage fp_add_pipe2 + two interleaved accumulator contexts
    per lane) implemented, verified bit-exact at LANES=1/4 and with a masked
    tail, in-loop, and formally; P4 (balanced leading-one detectors, library
    commit 2c013aa) implemented and verified. Fmax proxy (Yosys ltp -noff,
    flattened matrix_unit 32x16 LANES=1): 221 -> 211 (P4) -> 137 (P2) levels,
    ~1.54x; busy cycles unchanged (4755/1299/643). Remaining opportunities:
    P5 (direct fp_mul instance / specialised bf16 multiplier), P6 (overlap OUT
    with the next pass, tie off constant mode/rm).

current_dut: matrix_unit

next_optimization: >
  Realize the matrix_unit gains end-to-end. Every consumer still instantiates
  the matrix with the default LANES=1, so the committed optimizations are
  dormant. PLAN: create branch opt/lanes-rollout, set LANES=4 at every
  consumer (attention_unit Q/K/V/O, SwiGLU_unit gate+up and down, mamba2_unit
  in_proj/out_proj, output_projection_unit), keep every interface unchanged
  (the AXI handshake hides the extra latency), and verify each unit: lint
  clean + unit golden bit-exact + one in-loop per unit. THEN (follow-up)
  pipeline the multiplier with a new matrix-only fp_mul_pipe2 module (fp_mul
  is ~148 ltp levels, co-critical with the 137-level pipelined adder).
  Full instructions, expected cycle counts and verification requirements are
  in TODO.md, section "Next optimization target". Bit-exactness is absolute.
