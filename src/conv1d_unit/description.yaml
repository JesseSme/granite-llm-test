    width: 1
    description: 0=weight, 1=bias

max_clock_speed: 300 MHz (estimated; datapath is one shared fp_unit op per cycle,
  same bound as RMSNorm_unit, which shares the fp_unit critical path)

characteristics:
  latency: 17 clock cycles per output element (1 S_IDLE + 8 FPU ops × 2 cycles + 1 S_OUTPUT)
  throughput: 1 element per 17 cycles when continuously fed
  architecture: >
    Sequential FSM with a single shared fp32 fp_unit (W_EXP=8, W_MANT=23).
    The bfloat16 operands are widened to fp32 exactly (high-half placement),
    so all four products, their sum and the bias are computed in fp32 and only
    the result is rounded to bfloat16 once (fp32_to_bf16_round), matching
    ATen's causal_conv1d kernel (fp32 accumulation, one rounding); the unit is
    bit-exact against the Python reference.
    Computes 4-tap FIR per channel:
    w0*x[t] + w1*x[t-1] + w2*x[t-2] + w3*x[t-3] + bias. Circular buffer
    of 3×1536 elements stores previous timesteps. Each FPU operation takes
    2 cycles (present inputs + read result) due to the fp_unit's registered
    output and non-blocking assignment semantics.
  channels: 1536 (depthwise — each channel independent)
  kernel_size: 4
  padding: 3 (left/causal)
  weight_shape: "(1536, 1, 4) bfloat16 — loaded via load interface"
  bias_shape: "(1536,) bfloat16 — loaded via load interface"
  buffer: "3 × 1536 × 16-bit = 72 Kbit circular history buffer"
  design_notes: >
    Weights are reversed relative to PyTorch's Conv1d convention (cross-correlation)
    to match the RTL's convolution convention: w[0] multiplies the current input,
    w[1] multiplies t-1, etc. The golden sample generator applies this reversal.
  in_loop_verification: >
    tb_conv1d_unit_inloop.py hooks mamba.in_proj of Granite 4.0-H-350M layer 0 and
    recomputes the raw causal depthwise conv (F.conv1d, padding=3, groups=1792,
    pre-SiLU) from the captured projected states. The model's Conv1d module is not
    invoked on CPU (functional fallback), so a module hook would never fire. The
    1536 state-branch channels are driven through the DUT: 13824/13824 outputs
    within 0.1 abs, max abs error 0.03125.
  formal_verification: >
    formal/bmc.sby (SymbiYosys BMC, depth 120, fp_unit abstracted via an anyseq
    stub) proves: an output requires at least one accepted input, never more
    outputs than inputs, and at most one input outstanding at a time.
    Run: sby -f bmc.sby.
