name: rmsnorm_unit
description: >
  Hardware unit implementing the RMSNorm (Root Mean Square Normalization) layer,
  mapping the GraniteMoeHybridRMSNorm Python class (LLM_LAYER_DESCRIPTION.md §2a, §3a, §4, §6).
  Normalizes each hidden-state vector independently over the last dimension:
    output = input / sqrt(mean(input²) + eps) * weight
  where eps = 1e-5. Weight shape: (768,) in bfloat16.
  Input/output tensor shape: (B, S, 768) bfloat16.
  Used in 32 decoder layers (input_layernorm + post_attention_layernorm) and
  once as final_norm, for 65 total invocations per forward pass (see inference_trace.json steps 4,9,15,…).
  Also shared by GraniteMoeHybridRMSNormGated (steps 7,18,29,…) which applies
  RMSNorm to a gate branch (B,S,1536) float32 while element-wise gating a
  state branch (B,S,1536) bfloat16, with weight shape (1536,) ×2.

interface:
  ports:
    - name: clk
      direction: input
      width: 1
      description: Clock signal
    - name: rst_n
      direction: input
      width: 1
      description: Active-low synchronous reset
    - name: valid_in
      direction: input
      width: 1
      description: Input data valid strobe
    - name: data_in
      direction: input
      width: 16
      description: bfloat16 input data
    - name: weight_valid
      direction: input
      width: 1
      description: Weight data valid strobe
    - name: weight_in
      direction: input
      width: 16
      description: bfloat16 weight data
    - name: data_out
      direction: output
      width: 16
      description: bfloat16 output data
    - name: valid_out
      direction: output
      width: 1
      description: Output data valid strobe
    - name: busy
      direction: output
      width: 1
      description: Unit is processing (cannot accept new input)

max_clock_speed: 300 MHz

characteristics:
  latency: >
    ~28k cycles per vector: the ACCUM_SQ phase squares and accumulates each of
    the 768 elements (~10 cycles/element: MUL 4 + ADD 3 + handshake), then
    MEAN_EPS (DIV 17) and SQRT (17); the NORMALIZE phase multiplies by the
    weight, divides by the RMS and rounds to bfloat16 per element (~26
    cycles/element with the iterative divider).
  throughput: 1 vector per ~28k cycles (throughput = WIDTH / ~28k elements/cycle)
  resource_usage: >
    Uses 1 fp_unit instance (shared for MUL, ADD, DIV, SQRT operations),
    768 × 16-bit input buffer (12 Kbit BRAM),
    768 × 16-bit weight buffer (12 Kbit BRAM),
    and small control registers.
  notes: >
    Sequential FSM processing one vector of WIDTH elements at a time.
    The statistic (sum of squares, mean, eps, variance, sqrt) is accumulated
    and processed in fp32 (matching the model's float32 variance), with the
    bfloat16 inputs widened exactly (high-half placement) and a single
    bfloat16 rounding at the output; the fp32 accumulator was the fix for the
    earlier bf16 sum-of-squares error.
    Weight vector is loaded once and reused for all sequence positions.
    5-phase pipeline: BUFFER_INPUT → ACCUM_SQ → MEAN_EPS → SQRT_RMS → NORMALIZE.
    fp_unit protocol migration: each operation is started with a 1-cycle
    in_valid pulse and results are latched on the out_valid pulse; the
    DIV/SQRT engine is iterative (17 cycles) and its operation context is held
    stable across the request/wait states. `mean_eps_val` is 32-bit (it
    truncated the SQRT operand when it was 16-bit).
  unit_verification: >
    tb_rmsnorm_unit.py: model-derived golden sample, PASS after the fp32
    datapath fix and the fp_unit protocol migration.
  in_loop_verification: >
    tb_rmsnorm_unit_inloop.py captures real activations from 6 non-gated RMSNorm
    modules (input_layernorm layers 0/1/10/31, layer-0 post_attention_layernorm,
    final norm) of Granite 4.0-H-350M. 41472/41472 outputs bit-exact vs the
    model (fp32 statistic, one bf16 round) after the fp32 datapath fix and the
    fp_unit protocol migration. (Before the fix the RTL used a bf16
    sum-of-squares and deviated up to ~11.5% rel / 48 abs.)
  formal_verification: >
    formal/bmc.sby (SymbiYosys BMC, depth 80, fp_unit abstracted via an anyseq
    stub) proves: no output before the weight vector is fully loaded, output
    only while busy, busy only rises after an accepted input, and exactly WIDTH
    outputs per accepted vector. Run: sby -f bmc.sby. PASS after the protocol
    migration (latency-agnostic properties, unchanged by the migration).
