name: conv1d_unit
description: >-
  Implements torch.nn.Conv1d (causal depthwise 1D convolution) as used in
  Mamba2's SSM preprocessing step (LLM_LAYER_DESCRIPTION.md §2b Step 3).
  The operation applies a 4-tap FIR filter independently to each of 1536
  channels.  In the model the Conv1d module is created with
  in_channels=out_channels=groups=conv_dim=1792 (1536 state-branch x plus
  2x128 B/C channels); this unit implements the 1536-channel state branch,
  which is the slice fed to SiLU/SSM downstream.  Weight shape for this
  slice: (1536, 1, 4) — one 4-tap kernel per channel.  Bias shape: (1536,).
  Input/output shape: (B, S, 1536).  Left padding of 3 ensures causal
  (non-lookahead) behavior: at position t the output depends only on
  positions t, t-1, t-2, t-3.  Each channel is convolved with its own
  weight vector, producing a weighted sum of the current and three prior
  time-steps (plus bias), then passed to SiLU activation downstream.

