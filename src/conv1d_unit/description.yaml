  - name: clk
    direction: input
    width: 1
    description: Clock signal
  - name: rst_n
    direction: input
    width: 1
    description: Active-low asynchronous reset
  - name: valid_i
    direction: input
    width: 1
    description: Input valid signal
  - name: data_i
    direction: input
    width: 16
    description: bfloat16 input element
  - name: ready_o
    direction: output
    width: 1
    description: Ready to accept input
  - name: valid_o
    direction: output
    width: 1
    description: Output valid signal
  - name: data_o
    direction: output
    width: 16
    description: bfloat16 output element
  - name: load_en
    direction: input
    width: 1
    description: Weight/bias load enable
  - name: load_ch
    direction: input
    width: 11
    description: Channel index for weight/bias load
  - name: load_tap
